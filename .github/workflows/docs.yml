name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/build-llms-full.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/build-llms-full.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # VitePress reads git history for "last updated"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the build on broken internal links, so a bad cross-reference
      # never reaches the published site.
      - name: Build site
        run: npm run docs:build

      - name: Check generated artefacts
        run: |
          set -euo pipefail
          for f in sitemap.xml robots.txt llms.txt llms-full.txt \
                   .well-known/security.txt favicon.svg og-image.png; do
            test -s "docs/.vitepress/dist/$f" || { echo "missing: $f"; exit 1; }
          done
          # .nojekyll is intentionally empty, so existence is the only check.
          test -e docs/.vitepress/dist/.nojekyll \
            || { echo "missing: .nojekyll"; exit 1; }
          grep -q 'application/ld+json' docs/.vitepress/dist/index.html \
            || { echo "missing: schema.org JSON-LD"; exit 1; }
          echo "all artefacts present"

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
